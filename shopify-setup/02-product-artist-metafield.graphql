# Links a product to its artist. Run AFTER 01 — it needs the metaobject
# definition id that 01 returns.
#
#   shopify store execute -s <store>.myshopify.com --allow-mutations \
#     --query-file shopify-setup/02-product-artist-metafield.graphql \
#     --variable-file shopify-setup/02-product-artist-metafield.variables.json
#
# Requires the write_products scope — there is no write_metafield_definitions scope.

mutation CreateProductArtistMetafield($definition: MetafieldDefinitionInput!) {
  metafieldDefinitionCreate(definition: $definition) {
    createdDefinition {
      id
      namespace
      key
      name
      type { name }
      ownerType
    }
    userErrors {
      field
      message
      code
    }
  }
}
